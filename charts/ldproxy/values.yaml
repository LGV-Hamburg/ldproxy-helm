replicaCount: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

image:
  repository: iide/ldproxy
  tag: "4.6.1"
  pullPolicy: IfNotPresent
  pullSecret: []
    # - name: "my-registry-secret"

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 7080

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

initContainerResources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

persistence:
  enabled: true
  # If using an existing PVC (recommended, since PV/PVC are managed outside this chart),
  # set existingClaim to its name. If empty and enabled is true, a PVC will be created.
  existingClaim: ""
  # if not using existingClaim:
  storageClass: ""
  accessModes:
  - ReadWriteOnce
  size: 10Gi
  mountPath: /data/resources/features
  # Filename of the GPKG on the PVC to copy into the container.
  # If empty, all *.gpkg files are copied.
  gpkgFileName: ""

livenessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

# References to the external service and provider configuration files.
# These are created outside this chart and must end up at
#   /ldproxy/data/entities/instances/features/providers/streets.yml
#   /ldproxy/data/entities/instances/features/services/streets.yml
# Usually this means they live on the same PVC at those paths.
serviceConfig:
  # Optional: if the service/provider configs are delivered via existing ConfigMaps instead
  # of residing on the PVC, you can specify them here.
  # Each ConfigMap is mounted as a directory (NOT with subPath) so that Kubernetes
  # automatically propagates ConfigMap updates to the container without a pod restart.
  # Each ConfigMap must contain exactly one key matching the filename ldproxy expects
  # (e.g. "data.yml"), which will appear as a file inside the mounted directory.
  useConfigMaps: false
  serviceConfigMap: ""
  serviceConfigKey: ""
  providerConfigMap: ""
  providerConfigKey: ""
  datasetId: ""

initContainer:
  # busybox image used to build the ldproxy store directory in the init container
  image: busybox:1.36

serverConfig:
  # Convenience field: sets server.externalUrl in cfg.yml automatically.
  # Ignored if serverConfig.cfg.server.externalUrl is already set explicitly.
  externalUrl: "http://localhost:7080"

  # If set, this pre-existing ConfigMap is mounted as cfg.yml instead of
  # generating one from the cfg block below. The ConfigMap must contain
  # exactly one key named "cfg.yml".
  existingCfgConfigMap: ""

  # Full cfg.yml as a structured YAML object.
  # Supports every configuration option ldproxy recognises.
  # Reference: https://next.docs.ldproxy.net/de/application/20-configuration/
  #
  # serverConfig.externalUrl is merged into cfg.server.externalUrl unless
  # cfg.server.externalUrl is already set explicitly here.
  cfg:

    # ---------------------------------------------------------------------------
    # Webserver
    # https://next.docs.ldproxy.net/de/application/20-configuration/99-server
    # ---------------------------------------------------------------------------
    server:
      applicationConnectors:
        - type: http
          port: 7080
      # externalUrl is auto-populated from serverConfig.externalUrl.
      # Override here to use a value independent of serverConfig.externalUrl:
      # externalUrl: https://example.org/ldproxy

      # Request logging (disabled by default):
      # requestLog:
      #   type: classic
      #   timeZone: Europe/Berlin
      #   appenders:
      #     - type: file
      #       currentLogFilename: data/log/requests.log
      #       archive: true
      #       archivedLogFilenamePattern: data/log/requests-%d.zip
      #       archivedFileCount: 7

    # ---------------------------------------------------------------------------
    # Logging
    # https://next.docs.ldproxy.net/de/application/20-configuration/20-logging
    # ---------------------------------------------------------------------------
    logging:
      level: INFO
      appenders:
        - type: console
          timeZone: Europe/Berlin
      loggers:
        de.ii: INFO

    # ---------------------------------------------------------------------------
    # Store
    # https://next.docs.ldproxy.net/de/application/20-configuration/10-store-new
    # ---------------------------------------------------------------------------
    store:
      mode: RO
      # Additional FS sources (uncomment to add):
      # sources:
      #   - type: FS
      #     content: ALL
      #     src: /ldproxy/data

    # ---------------------------------------------------------------------------
    # Jobs (replaces deprecated backgroundTasks, v4.6+)
    # https://next.docs.ldproxy.net/de/application/20-configuration/91-jobs
    # ---------------------------------------------------------------------------
    jobs:
      maxThreads: 1

    # ---------------------------------------------------------------------------
    # Authorization (optional)
    # https://next.docs.ldproxy.net/de/application/20-configuration/40-auth
    # ---------------------------------------------------------------------------
    # auth:
    #   enabled: false

    # ---------------------------------------------------------------------------
    # Modules (optional, v4.0+)
    # https://next.docs.ldproxy.net/de/application/20-configuration/80-modules
    # ---------------------------------------------------------------------------
    # modules: {}

    # ---------------------------------------------------------------------------
    # HTTP Client (optional)
    # https://next.docs.ldproxy.net/de/application/20-configuration/97-http-client
    # ---------------------------------------------------------------------------
    # httpClient:
    #   maxConnections: 128
    #   connectTimeout: 500ms
    #   timeout: 30s
    #   proxy:
    #     host: proxy.example.org
    #     port: 3128
    #     nonProxyHosts:
    #       - localhost

    # ---------------------------------------------------------------------------
    # Substitutions (optional)
    # https://next.docs.ldproxy.net/de/application/20-configuration/95-substitutions
    # ---------------------------------------------------------------------------
    # substitutions: {}

    # ---------------------------------------------------------------------------
    # Redis (optional, v4.6+)
    # https://next.docs.ldproxy.net/de/application/20-configuration/110-redis
    # ---------------------------------------------------------------------------
    # redis:
    #   host: redis
    #   port: 6379

gateway:
  # The name of the Gateway this HTTPRoute should attach to. The Gateway must already exist.
  # This chart does not create the Gateway, since it is usually shared by multiple HTTPRoutes.
  gatewayName: ""
  hostname: ""
  sectionName: web
  sectionNameTls: websecure
