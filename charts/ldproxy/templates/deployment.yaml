apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ldproxy.fullname" . }}
  labels:
    {{- include "ldproxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ldproxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ldproxy.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      {{- end }}
      initContainers:
        # Always runs: copies the GPKG from the Azure file share (PVC) into a writable
        # emptyDir so the main container never holds an open handle on the file share.
        - name: init-gpkg
          image: {{ .Values.initContainer.image }}
          command:
            - sh
            - -c
            - |-
              set -e
              mkdir -p {{ .Values.persistence.mountPath }}
              {{- if .Values.persistence.gpkgFileName }}
              cp /source/{{ .Values.persistence.gpkgFileName }} {{ .Values.persistence.mountPath }}/{{ .Values.persistence.gpkgFileName }}
              {{- else }}
              cp /source/*.gpkg {{ .Values.persistence.mountPath }}/
              {{- end }}
              echo "GPKG copy done."
          resources:
{{- toYaml .Values.initContainerResources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /source
              readOnly: true
            - name: gpkg
              mountPath: {{ .Values.persistence.mountPath }}
      containers:
        - name: ldproxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            # LDPROXY_DATA_DIR is not a recognized ldproxy setting; the app always
            # uses /data as its data directory. Verify persistence.mountPath instead
            # (see gpkg volumeMount below): it must resolve to /data/resources/features/
            # for connectionInfo.database: <file>.gpkg to be found by the provider.
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          volumeMounts:
            {{- if .Values.serviceConfig.useConfigMaps }}
            # store- volumes hold real files kept in sync from cm- volumes by config-sync
            - name: store-services
              mountPath: /data/entities/instances/services
            - name: store-providers
              mountPath: /data/entities/instances/providers
            - name: entities-defaults
              mountPath: /data/entities/defaults
            - name: entities-overrides
              mountPath: /data/entities/overrides
            - name: entities-values
              mountPath: /data/values
            - name: entities-resources
              mountPath: /data/resources
            {{- end }}
            # cfg.yml is only read at startup, so subPath (no live reload) is fine here
            - name: cfg
              mountPath: /data/cfg.yml
              subPath: cfg.yml
            # GPKG copied from the PVC by init-gpkg; main container uses the emptyDir copy
            - name: gpkg
              mountPath: {{ .Values.persistence.mountPath }}
            - name: tmp
              mountPath: /data/tmp
          resources:
{{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.serviceConfig.useConfigMaps }}
        # ConfigMap mounts are symlink chains (..data -> ..<ts>/file); ldproxy's entity
        # walker does not follow symlinks so those files are never discovered. This
        # sidecar dereferences them into plain regular files on a polling interval.
        # ldproxy itself writes back into these entity files (autoPersist, lastModified,
        # storage-version migration), so syncing must be one-way and change-aware: only
        # overwrite a file when its ConfigMap source actually changed since the last
        # tick, otherwise ldproxy's own writes are left untouched between config edits.
        - name: config-sync
          image: busybox:1.36
          command:
            - sh
            - -c
            - |-
              set -e
              mkdir -p /var/lib/config-sync/services /var/lib/config-sync/providers
              sync_dir() {
                src=$1; dst=$2; mirror=$3
                for f in "$src"/*; do
                  [ -e "$f" ] || continue
                  name=$(basename "$f")
                  if ! cmp -s "$f" "$mirror/$name" 2>/dev/null; then
                    cp -L "$f" "$dst/$name"
                    cp -L "$f" "$mirror/$name"
                  fi
                done
              }
              while true; do
                sync_dir /cm/services /store/services /var/lib/config-sync/services
                sync_dir /cm/providers /store/providers /var/lib/config-sync/providers
                sleep 5
              done
          volumeMounts:
            - name: entities-services
              mountPath: /cm/services
              readOnly: true
            - name: entities-providers
              mountPath: /cm/providers
              readOnly: true
            - name: store-services
              mountPath: /store/services
            - name: store-providers
              mountPath: /store/providers
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        # emptyDir populated by init-gpkg; main container reads the GPKG from here
        - name: gpkg
          emptyDir: {}
        {{- if .Values.serviceConfig.useConfigMaps }}
        # raw ConfigMap sources (symlinks); only read by config-sync, never by ldproxy
        - name: entities-services
          configMap:
            name: {{ .Values.serviceConfig.serviceConfigMap }}
        # projected volume merges base + tiles provider CMs into a single directory
        - name: entities-providers
          projected:
            sources:
              - configMap:
                  name: {{ .Values.serviceConfig.providerConfigMap }}
                  items:
                    - key: {{ .Values.serviceConfig.providerConfigKey }}
                      path: {{ .Values.serviceConfig.providerConfigKey }}
              {{- if .Values.serviceConfig.tilesProviderConfigMap }}
              - configMap:
                  name: {{ .Values.serviceConfig.tilesProviderConfigMap }}
                  items:
                    - key: {{ .Values.serviceConfig.tilesProviderConfigKey }}
                      path: {{ .Values.serviceConfig.tilesProviderConfigKey }}
              {{- end }}
        # writable, real-file mirrors of the ConfigMaps above, kept in sync by config-sync
        - name: store-services
          emptyDir: {}
        - name: store-providers
          emptyDir: {}
        - name: entities-defaults
          emptyDir: {}
        - name: entities-overrides
          emptyDir: {}
        - name: entities-values
          emptyDir: {}
        - name: entities-resources
          emptyDir: {}
        {{- end }}
        - name: cfg
          configMap:
            name: {{ if .Values.serverConfig.existingCfgConfigMap }}{{ .Values.serverConfig.existingCfgConfigMap }}{{ else }}{{ include "ldproxy.fullname" . }}-cfg{{ end }}
        - name: data
          {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
          {{- else if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ldproxy.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}