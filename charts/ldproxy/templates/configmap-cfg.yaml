{{- if not .Values.serverConfig.existingCfgConfigMap }}
{{- /*
  Build the cfg.yml object:
  1. Deep-copy the structured cfg block from values so we don't mutate it.
  2. Ensure server.externalUrl is populated: use serverConfig.externalUrl as
     a fallback when the user has not set cfg.server.externalUrl explicitly.
  3. Render the resulting object as YAML inside the ConfigMap data key.
*/ -}}
{{- $cfg := deepCopy .Values.serverConfig.cfg }}
{{- $server := $cfg.server | default dict }}
{{- if not (hasKey $server "externalUrl") }}
{{-   $_ := set $server "externalUrl" .Values.serverConfig.externalUrl }}
{{- end }}
{{- $_ := set $cfg "server" $server }}
kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ include "ldproxy.fullname" . }}-cfg
  labels:
    {{- include "ldproxy.labels" . | nindent 4 }}
data:
  cfg.yml: |-
    ---
    {{- toYaml $cfg | nindent 4 }}
{{- end }}